android.useAndroidX=true
android.nonTransitiveRClass=true
# Kept modest deliberately, matching gdrive's own Android build: this build
# also runs a cgo cross-compile of the Go engine (2 ABIs) and an NDK native
# build (hev-socks5-tunnel) as separate child processes alongside
# Gradle/Kotlin/AGP within the same CI VM. A large Gradle heap leaves less
# headroom for those concurrent processes on a standard GitHub-hosted runner.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
